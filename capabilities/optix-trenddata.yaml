naftiko: 1.0.0-alpha2
info:
  label: Rockwell FactoryTalk Optix REST API — TrendData
  description: 'Rockwell FactoryTalk Optix REST API — TrendData. 1 operations. Lead operation: Get Historical Trend Data.
    Self-contained Naftiko capability covering one Rockwell Factorytalk business surface.'
  tags:
  - Rockwell Factorytalk
  - TrendData
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ROCKWELL_FACTORYTALK_API_KEY: ROCKWELL_FACTORYTALK_API_KEY
capability:
  consumes:
  - type: http
    namespace: optix-trenddata
    baseUri: https://{host}/api/v1
    description: Rockwell FactoryTalk Optix REST API — TrendData business capability. Self-contained, no shared references.
    resources:
    - name: trends-tagName
      path: /trends/{tagName}
      operations:
      - name: gettrenddata
        method: GET
        description: Get Historical Trend Data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: startTime
          in: query
          type: string
          required: true
        - name: endTime
          in: query
          type: string
          required: true
        - name: resolution
          in: query
          type: string
          description: Data resolution (e.g., 1s, 1m, 1h)
        - name: limit
          in: query
          type: integer
    authentication:
      type: bearer
      token: '{{env.ROCKWELL_FACTORYTALK_API_KEY}}'
  exposes:
  - type: rest
    namespace: optix-trenddata-rest
    port: 8080
    description: REST adapter for Rockwell FactoryTalk Optix REST API — TrendData. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/trends/{tagname}
      name: trends-tagname
      description: REST surface for trends-tagName.
      operations:
      - method: GET
        name: gettrenddata
        description: Get Historical Trend Data
        call: optix-trenddata.gettrenddata
        with:
          startTime: rest.startTime
          endTime: rest.endTime
          resolution: rest.resolution
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: optix-trenddata-mcp
    port: 9090
    transport: http
    description: MCP adapter for Rockwell FactoryTalk Optix REST API — TrendData. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-historical-trend-data
      description: Get Historical Trend Data
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: optix-trenddata.gettrenddata
      with:
        startTime: tools.startTime
        endTime: tools.endTime
        resolution: tools.resolution
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
